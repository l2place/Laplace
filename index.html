.tint {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(circle at 20% 25%, rgba(90, 90, 90, 0.25), transparent 50%),
    radial-gradient(circle at 80% 75%, rgba(40, 40, 40, 0.3), transparent 55%),
    linear-gradient(160deg, rgba(5, 5, 5, 0.72) 0%, rgba(15, 15, 15, 0.5) 45%, rgba(5, 5, 5, 0.78) 100%);
}
@keyframes gradientZoom { 0%{transform:scale(1.05);} 50%{transform:scale(1.16);} 100%{transform:scale(1.05);} }
.card {
  width: 100%;
  max-width: 400px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 28px;
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  box-shadow: 0 8px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
  padding: 40px 28px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  opacity: 0;
  transform: translateY(28px);
  animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
}
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
.profile { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.avatar-ring {
  width: 96px; height: 96px; border-radius: 50%; padding: 3px;
  background: linear-gradient(145deg, #ffffff, #4a4a4a, #0a0a0a);
  animation: floaty 5s ease-in-out infinite;
}
@keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

  width: 100%; padding: 15px 18px; border-radius: 16px; text-decoration: none;
  color: #0a0a0a; background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.5);
  font-weight: 600; font-size: 15px; letter-spacing: 0.2px; cursor: pointer; overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), background-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  opacity: 0; transform: translateY(16px); animation: linkIn 0.6s ease forwards;
  will-change: transform;
}
.link-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.4), transparent 60%);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
  mix-blend-mode: overlay;
}
.link-btn:hover::before, .link-btn:focus-visible::before { opacity: 1; }
.link-btn .icon, .link-btn .label, .link-btn .arrow { position: relative; z-index: 1; }
.links .link-btn:nth-child(1){animation-delay:0.35s;}
.links .link-btn:nth-child(2){animation-delay:0.45s;}
.links .link-btn:nth-child(3){animation-delay:0.55s;}
.links .link-btn:nth-child(4){animation-delay:0.65s;}
@keyframes linkIn { to { opacity: 1; transform: translateY(0); } }
.link-btn .icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.link-btn .icon svg { width: 100%; height: 100%; }
.link-btn .label { flex: 1; }
.link-btn .arrow { opacity: 0; transform: translate(-4px, 4px); transition: opacity 0.3s ease, transform 0.3s ease; font-size: 14px; }
.link-btn:hover, .link-btn:focus-visible {
  background: #0a0a0a; color: #ffffff; border-color: rgba(255,255,255,0.18);
  transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
}
.link-btn:hover .arrow, .link-btn:focus-visible .arrow { opacity: 0.7; transform: translate(0,0); }
.link-btn:active { transform: translateY(-1px) scale(0.98); }
.footer { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.3px; }
.footer-row { display: flex; align-items: center; gap: 8px; }
.visitor-count { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 0.4px; min-height: 14px; opacity: 0; transition: opacity 0.6s ease; }
.visitor-count.visible { opacity: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #7dffb0; box-shadow: 0 0 8px 2px rgba(125,255,176,0.6); animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
@media (max-width: 420px) {

  .username { font-size: 20px; }

}
@media (prefers-reduced-motion: reduce) {

  .card, .link-btn { opacity: 1 !important; transform: none !important; }
}#particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

  var canvas = document.getElementById("particles");

  function rand(min, max) {
    return Math.random() * (max - min) + min;

  function createParticle() {
    return {

      y: rand(0, window.innerHeight),
      r: rand(0.6, 2.3),
      baseOpacity: rand(0.12, 0.5),
      speed: rand(0.12, 0.42),
      drift: rand(0.3, 1.1),
      phase: rand(0, Math.PI * 2),
      flicker: rand(0.4, 1.3)

    for (var i = 0; i < particles.length; i++) {

      var p = particles[i];

      p.y -= p.speed;
      p.x += Math.sin(t * p.flicker + p.phase) * p.drift * 0.05;

      var extraGlow = 0;

      if (mouse.active) {
        var dx = p.x - mouse.x;
        var dy = p.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < REACT_RADIUS && dist > 0.001) {
          var force = (REACT_RADIUS - dist) / REACT_RADIUS;
          p.x += (dx / dist) * force * 2.6;
          p.y += (dy / dist) * force * 2.6;
          extraGlow = force * 0.55;
        }
      }

      if (p.y < -10) {
        p.y = window.innerHeight + 10;
        p.x = rand(0, window.innerWidth);
      }
      if (p.x < -10) p.x = window.innerWidth + 10;
      if (p.x > window.innerWidth + 10) p.x = -10;

      var opacity = p.baseOpacity * (0.55 + 0.45 * Math.sin(t * p.flicker + p.phase)) + extraGlow;
      var radius = p.r + extraGlow * 1.6;

      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + Math.min(Math.max(opacity, 0), 1) + ")";
      ctx.shadowColor = "rgba(255,255,255,0.6)";
      ctx.shadowBlur = radius * (3.2 + extraGlow * 4);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }

  function onMouseMove(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }

  function onMouseLeave() {
    mouse.active = false;
  }

  function onTouchMove(e) {
    if (e.touches && e.touches[0]) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      if (reduced) drawStatic();
    }, 120);
  });

  window.addEventListener("mousemove", onMouseMove, { passive: true });
  window.addEventListener("mouseleave", onMouseLeave, { passive: true });
  window.addEventListener("touchmove", onTouchMove, { passive: true });
  window.addEventListener("touchend", onMouseLeave, { passive: true });

  init();
  if (reduced) {
    drawStatic();
  } else {
    animate();
  }
})();
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;

  var buttons = document.querySelectorAll(".link-btn");

  buttons.forEach(function (btn) {
    var rect = null;

    btn.addEventListener("mouseenter", function () {
      rect = btn.getBoundingClientRect();
      btn.style.transition =
        "transform 0.12s ease-out, background-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease";
    });

    btn.addEventListener("mousemove", function (e) {
      if (!rect) rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      var px = (x / rect.width) * 100;
      var py = (y / rect.height) * 100;
      btn.style.setProperty("--mx", px + "%");
      btn.style.setProperty("--my", py + "%");

      var rotateY = ((x / rect.width) - 0.5) * 8;
      var rotateX = ((y / rect.height) - 0.5) * -8;

      btn.style.transform =
        "translateY(-4px) perspective(700px) rotateX(" +
        rotateX.toFixed(2) +
        "deg) rotateY(" +
        rotateY.toFixed(2) +
        "deg)";
    });

    btn.addEventListener("mouseleave", function () {
      btn.style.transition =
        "transform 0.5s cubic-bezier(0.22,1,0.36,1), background-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease";
      btn.style.transform = "";
      rect = null;
    });
  });

  window.addEventListener("resize", function () {
    // rect is recalculated lazily on next mouseenter/mousemove
  });
})();

(function () {
  "use strict";

  var COUNTER_KEY = "laplace_links_l2place_9f3k";
  var STORAGE_FLAG = "laplace_visited";
  var el = document.getElementById("visitor-count");
  if (!el) return;

  var alreadyVisited = false;
  try {
    alreadyVisited = localStorage.getItem(STORAGE_FLAG) === "1";
  } catch (e) {
    // localStorage unavailable (private mode etc) — just treat as a fresh visit each time
  }

  var base = "https://countapi.mileshilliard.com/api/v1/";
  var endpoint = base + (alreadyVisited ? "get/" : "hit/") + COUNTER_KEY;

  fetch(endpoint)
    .then(function (res) {
      return res.json();
    })
    .then(function (data) {
      if (!data || data.value === undefined) return;
      var n = Number(data.value);
      if (isNaN(n)) return;

      el.textContent = n.toLocaleString() + (n === 1 ? " visitor" : " visitors");
      el.classList.add("visible");

      if (!alreadyVisited) {
        try {
          localStorage.setItem(STORAGE_FLAG, "1");
        } catch (e) {
          /* ignore */
        }
      }
    })
    .catch(function () {
      // Counter service unreachable — fail silently, don't break the page
    });
})();
